[package]
name = "sdui-cel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# cel-interpreter provides the CEL parser + evaluator. `default-features = false`
# drops `regex` + `chrono` — Iteration 5 uses only literal/built-in operators
# (no regex, no timestamp/duration), so those features are unnecessary and
# would bloat the wasm bundle.
# crates.io: https://crates.io/crates/cel-interpreter/0.10.0
# features source: https://github.com/clarkmcc/cel-rust/blob/cel-interpreter-v0.10.0/interpreter/Cargo.toml
cel-interpreter = { workspace = true, default-features = false }
thiserror = { workspace = true }
