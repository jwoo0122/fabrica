[package]
name = "app-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# cdylib is required for wasm-bindgen's glue generator.
[lib]
name = "app_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
sdui-core = { path = "../sdui-core" }
sdui-runtime-wgpu = { path = "../sdui-runtime-wgpu" }

# accesskit (web/wasm mirror -- manual DOM writer until upstream adapter ships)
accesskit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { workspace = true }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Blob",
    "Window",
] }
