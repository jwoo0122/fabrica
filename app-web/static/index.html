<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sdui smoke</title>
  </head>
  <body>
    <div
      id="sdui-stage"
      style="display:flex;gap:1rem;align-items:flex-start;padding:1rem;"
    >
      <div id="sdui-canvas-host"></div>
      <aside id="sdui-panel" style="width:360px;">
        <textarea
          id="scene-editor"
          rows="20"
          style="width:100%;font-family:monospace;"
        ></textarea>
        <button id="scene-apply" type="button">Apply</button>
        <pre
          id="scene-error"
          hidden
          style="color:#b00;white-space:pre-wrap;"
        ></pre>
      </aside>
    </div>
    <!--
      Served by `cargo xtask run-web`. The referenced .wasm module is placed
      next to this file by xtask's wasm-bindgen invocation; see
      xtask/src/main.rs `build_web_dist`.
    -->
    <script type="module">
      import init, { apply_scene_json } from "./app_web.js";

      const editor = document.getElementById("scene-editor");
      const apply = document.getElementById("scene-apply");
      const error = document.getElementById("scene-error");

      const showError = (e) => {
        error.textContent = String(e);
        error.hidden = false;
      };

      init("./app_web_bg.wasm")
        .then(async () => {
          try {
            const response = await fetch("./scene.json");
            if (!response.ok) {
              throw new Error(`scene.json fetch failed: HTTP ${response.status}`);
            }
            editor.value = await response.text();
            error.hidden = true;
          } catch (e) {
            showError(e);
          }

          apply.addEventListener("click", async () => {
            try {
              await apply_scene_json(editor.value);
              error.textContent = "";
              error.hidden = true;
            } catch (e) {
              showError(e);
            }
          });
        })
        .catch((e) => {
          console.error("sdui boot failure", e);
          showError(e);
        });
    </script>
  </body>
</html>
