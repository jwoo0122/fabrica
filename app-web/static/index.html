<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sdui</title>
    <!--
      The axum server hands this file to both `/examples/<name>` and
      `/examples/<name>/`. The module below uses `./app_web.js`, which
      only resolves correctly when the current URL ends in `/`. If we
      landed on the slash-less variant, navigate once to the canonical
      form so the module loader stays inside the bundle directory.
    -->
    <script>
      (function () {
        var loc = window.location;
        if (loc.pathname.startsWith("/examples/") && !loc.pathname.endsWith("/")) {
          loc.replace(loc.pathname + "/" + loc.search + loc.hash);
        }
      })();
    </script>
  </head>
  <body>
    <!--
      Served by `cargo xtask run-web`. The referenced .wasm module is placed
      next to this file by xtask's wasm-bindgen invocation; see
      xtask/src/main.rs `build_web_dist`.
    -->
    <script type="module">
      import init from "./app_web.js";
      init("./app_web_bg.wasm").catch((e) => {
        console.error("sdui boot failure", e);
      });
    </script>
  </body>
</html>
